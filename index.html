<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon Light</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    font-family: "Courier New", Courier, "Noto Sans Mono CJK SC", monospace;
    background: #000000;
    color: #e7ded1;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    gap: 50px;
  }

  /* ===== 渐进入场动画（延长至10秒） ===== */
  .fade-in {
    opacity: 0;
    animation: fadeInUp 10s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(24px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .delay-1 { animation-delay: 0s; }
  .delay-2 { animation-delay: 1.5s; }
  .delay-3 { animation-delay: 3s; }
  .delay-4 { animation-delay: 4.5s; }

  /* ===== 标题区（居中） ===== */
  .head {
    text-align: center;
  }

  .title {
    font-family: "Times New Roman", "Songti SC", "Noto Serif CJK SC", serif;
    font-weight: 400;
    font-size: clamp(24px, 5.6vw, 52px);
    line-height: 1.12;
    letter-spacing: -0.02em;
    color: #e7ded1;
  }

  /* ===== 动态乱码副标题 ===== */
  .sub-wrap {
    margin-top: 22px;
  }

  .sub {
    position: relative;
    display: inline-block;
    font-family: "Courier New", Courier, monospace;
    font-size: clamp(12px, 1.8vw, 15px);
    text-transform: uppercase;
    color: #e7ded1;
    white-space: nowrap;
    animation:
      glitch-skew 2s infinite steps(1),
      glitch-spacing 3s infinite steps(1);
  }

  .sub::before,
  .sub::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    color: #e7ded1;
    overflow: hidden;
    pointer-events: none;
  }

  .sub::before {
    text-shadow:
      -4px 0 #ff2d55,
      4px 0 #00e5ff,
      -2px 2px #ff2d55,
      2px -2px #00e5ff;
    animation: glitch-slice-a 1.2s infinite linear alternate-reverse;
  }

  .sub::after {
    text-shadow:
      4px 0 #00e5ff,
      -4px 0 #ff2d55,
      2px -2px #00e5ff,
      -2px 2px #ff2d55;
    animation: glitch-slice-b 0.9s infinite linear alternate-reverse;
  }

  @keyframes glitch-skew {
    0%, 80%, 100% { transform: skewX(0deg); }
    81% { transform: skewX(2.5deg); }
    82% { transform: skewX(-2deg); }
    83% { transform: skewX(1.5deg); }
    84% { transform: skewX(-1deg); }
    85% { transform: skewX(0deg); }
  }

  @keyframes glitch-spacing {
    0%, 100% { letter-spacing: 0.22em; }
    20% { letter-spacing: 0.35em; }
    40% { letter-spacing: 0.1em; }
    60% { letter-spacing: 0.3em; }
    80% { letter-spacing: 0.18em; }
  }

  @keyframes glitch-slice-a {
    0%   { clip-path: inset(42% 0 48% 0); transform: translate(-6px, -3px); }
    10%  { clip-path: inset(8% 0 82% 0);  transform: translate(6px, 2px); }
    20%  { clip-path: inset(68% 0 12% 0); transform: translate(-5px, 1px); }
    30%  { clip-path: inset(22% 0 65% 0); transform: translate(7px, -2px); }
    40%  { clip-path: inset(85% 0 5% 0);  transform: translate(-4px, 3px); }
    50%  { clip-path: inset(5% 0 90% 0);  transform: translate(5px, -1px); }
    60%  { clip-path: inset(55% 0 30% 0); transform: translate(-7px, 2px); }
    70%  { clip-path: inset(18% 0 72% 0); transform: translate(4px, -3px); }
    80%  { clip-path: inset(75% 0 10% 0); transform: translate(-6px, 1px); }
    90%  { clip-path: inset(30% 0 55% 0); transform: translate(6px, -2px); }
    100% { clip-path: inset(60% 0 25% 0); transform: translate(-5px, 3px); }
  }

  @keyframes glitch-slice-b {
    0%   { clip-path: inset(70% 0 18% 0); transform: translate(6px, 3px); }
    9%   { clip-path: inset(22% 0 62% 0); transform: translate(-6px, -2px); }
    18%  { clip-path: inset(48% 0 40% 0); transform: translate(5px, 1px); }
    27%  { clip-path: inset(6% 0 82% 0);  transform: translate(-7px, 2px); }
    36%  { clip-path: inset(85% 0 5% 0);  transform: translate(6px, -3px); }
    45%  { clip-path: inset(34% 0 52% 0); transform: translate(-5px, 1px); }
    54%  { clip-path: inset(60% 0 26% 0); transform: translate(7px, 3px); }
    63%  { clip-path: inset(12% 0 74% 0); transform: translate(-6px, -2px); }
    72%  { clip-path: inset(44% 0 46% 0); transform: translate(5px, 1px); }
    81%  { clip-path: inset(78% 0 12% 0); transform: translate(-7px, 2px); }
    90%  { clip-path: inset(28% 0 58% 0); transform: translate(6px, -3px); }
    100% { clip-path: inset(55% 0 32% 0); transform: translate(-5px, 3px); }
  }

  /* ===== 倒计时网格 ===== */
  .timer {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid #e7ded1;
    border-bottom: 1px solid #e7ded1;
  }

  .unit {
    padding: 18px 0 16px;
    text-align: center;
    border-right: 1px solid #e7ded1;
  }

  .unit:last-child { border-right: none; }

  .unit .num {
    font-family: "Times New Roman", "Songti SC", serif;
    font-weight: 400;
    font-size: clamp(36px, 8vw, 72px);
    line-height: 0.9;
    letter-spacing: -0.016em;
    font-variant-numeric: tabular-nums;
    color: #e7ded1;
  }

  .unit .label {
    font-family: "Courier New", Courier, monospace;
    font-size: 11px;
    letter-spacing: -0.045em;
    text-transform: uppercase;
    color: #e7ded1;
    margin-top: 8px;
    opacity: 0.45;
  }

  /* ===== 状态与进度 ===== */
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 11px;
    letter-spacing: -0.045em;
    text-transform: uppercase;
    color: #e7ded1;
  }

  .status { opacity: 0.6; }

  .pct { font-variant-numeric: tabular-nums; }

  .bar-track {
    width: 100%;
    height: 1px;
    background: #e7ded1;
    opacity: 0.2;
    position: relative;
    margin-top: 12px;
  }

  .bar-fill {
    position: absolute;
    top: 0; left: 0;
    height: 100%;
    width: 0%;
    background: #e7ded1;
  }

  /* ===== 倒计时结束后：视频揭晓 ===== */
  /* 必须覆盖 fade-in 的 animation（forwards 会锁死 opacity:1，导致 .gone 的 opacity:0 无效） */
  .timer.gone,
  .meta-block.gone {
    animation: none;
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity 0.9s ease, transform 0.9s ease;
    pointer-events: none;
  }

  .reveal { display: none; }

  .reveal.show {
    display: block;
    animation: fadeInUp 1.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  .player {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 1px solid rgba(231, 222, 209, 0.35);
    overflow: hidden;
    background: #000;
  }

  .player iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .watch {
    display: inline-block;
    margin-top: 16px;
    font-family: "Courier New", Courier, monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #e7ded1;
    opacity: 0.55;
    text-decoration: none;
    border-bottom: 1px solid rgba(231, 222, 209, 0.4);
    padding-bottom: 2px;
    transition: opacity 0.25s ease;
  }

  .watch:hover { opacity: 1; }

  .ended-mark {
    text-align: center;
    font-family: "Times New Roman", "Songti SC", serif;
    font-size: clamp(18px, 3.4vw, 28px);
    color: #e7ded1;
    margin-bottom: 22px;
  }

  /* 响应式 */
  @media (max-width: 520px) {
    .timer { grid-template-columns: 1fr 1fr; }
    .unit:nth-child(2) { border-right: none; }
    .unit:nth-child(1),
    .unit:nth-child(2) { border-bottom: 1px solid #e7ded1; }
    .wrap { gap: 36px; }
    .sub { letter-spacing: 0.12em; font-size: 10px; }
  }
</style>
</head>
<body>

  <div class="wrap">

    <!-- 标题区：居中 -->
    <div class="head">
      <div class="title fade-in delay-1">The horizon is stretching out……</div>
      <div class="sub-wrap fade-in delay-2">
        <div class="sub" data-text="Ex Light &amp; Bass 2026">Ex Light &amp; Bass 2026</div>
      </div>
    </div>

    <!-- 倒计时 -->
    <div class="timer fade-in delay-3">
      <div class="unit">
        <div class="num" id="d">0</div>
        <div class="label">Days</div>
      </div>
      <div class="unit">
        <div class="num" id="h">00</div>
        <div class="label">Hours</div>
      </div>
      <div class="unit">
        <div class="num" id="m">00</div>
        <div class="label">Minutes</div>
      </div>
      <div class="unit">
        <div class="num" id="s">00</div>
        <div class="label">Seconds</div>
      </div>
    </div>

    <!-- 状态 + 进度 -->
    <div class="meta-block fade-in delay-4" id="metaBlock">
      <div class="meta">
        <span class="status" id="status">Loading</span>
        <span class="pct" id="pct">0.00%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" id="progress"></div>
      </div>
    </div>

    <!-- 倒计时结束后揭晓的视频 -->
    <div class="reveal" id="reveal">
      <div class="ended-mark">Ex Light &amp; Bass 2026</div>
      <div class="player">
        <iframe
          src="https://player.bilibili.com/player.html?bvid=BV1MEpn6cEJ2&page=1&autoplay=0&danmaku=0&high_quality=1"
          scrolling="no"
          frameborder="0"
          allowfullscreen>
        </iframe>
      </div>
      <a class="watch" href="https://www.bilibili.com/video/BV1MEpn6cEJ2" target="_blank" rel="noopener">前往 Bilibili 观看 ↗</a>
    </div>

  </div>

<script>
(function () {
  /* ====== 时间设置（北京时间 UTC+8） ======
     开始：2026.10.08 00:00 CST  → UTC 2026-10-07 16:00
     结束：2026.10.12 19:00 CST  → UTC 2026-10-12 11:00
     测试：URL 加 ?end=<ISO时间> 可临时覆盖结束时间
           例：?end=2020-01-01T00:00:00Z 直接预览揭晓状态
  ========================================= */
  const START = Date.UTC(2026, 9, 7, 16, 0, 0);
  const END   = Date.UTC(2026, 9, 12, 11, 0, 0);
  const TOTAL = END - START;

  // 测试用：?end=... 覆盖结束时间
  const endParam = new URLSearchParams(location.search).get('end');
  let endAt = END;
  if (endParam) {
    const t = Date.parse(endParam);
    if (!isNaN(t)) endAt = t;
  }

  const els = {
    d: document.getElementById('d'),
    h: document.getElementById('h'),
    m: document.getElementById('m'),
    s: document.getElementById('s')
  };
  const statusEl   = document.getElementById('status');
  const progressEl = document.getElementById('progress');
  const pctEl      = document.getElementById('pct');
  const timerEl    = document.querySelector('.timer');
  const metaEl     = document.getElementById('metaBlock');
  const revealEl   = document.getElementById('reveal');
  let revealed     = false;

  /* ===== 动态乱码 + 按进度解密 ===== */
  const TARGET = "Ex Light & Bass 2026";     // 最终明文
  const CHARS  = "ﾊｲﾂﾞﾖﾘﾑﾎﾞｴｷﾀﾅｼﾞｳﾞｫﾟﾐﾔﾗﾜﾝ#@%&*+=?!<>/\\|~^";
  const subEl  = document.querySelector('.sub');
  let revealPct = 0;   // 0~100，由倒计时进度驱动

  function randomChar() {
    return CHARS.charAt(Math.floor(Math.random() * CHARS.length));
  }

  /* 生成当前应显示的文本：
     - 已解密部分（按进度）显示明文对应字符
     - 未解密部分随机显示乱码字符
     每次调用都会重新随机未解密部分，形成持续闪烁 */
  function buildText() {
    const revealed = Math.floor(TARGET.length * Math.min(revealPct, 100) / 100);
    let out = "";
    for (let i = 0; i < TARGET.length; i++) {
      out += (i < revealed) ? TARGET[i] : randomChar();
    }
    return out;
  }

  function paintGlitch() {
    const text = buildText();
    subEl.textContent = text;
    subEl.setAttribute('data-text', text); // 让红蓝重影同步跟随
  }

  /* 乱码持续闪烁，约每秒 11 次刷新 */
  setInterval(paintGlitch, 90);
  paintGlitch();

  /* ===== 倒计时逻辑 ===== */
  // 天数不补零，时/分/秒补足两位
  function pad(n, len) {
    const s = String(n);
    return s.length >= len ? s : '0'.repeat(len - s.length) + s;
  }

  function setNum(key, value, len) {
    const el = els[key];
    // len 为 0 / 未传时不做补零，直接显示原数字
    const str = len ? pad(value, len) : String(value);
    if (el.textContent === str) return;
    el.textContent = str;
  }

  function render() {
    const now = new Date();
    const total = endAt - START;
    const remain = endAt - now;

    // 进度（0~100）
    const elapsed = Math.min(Math.max(now - START, 0), Math.max(total, 0));
    const pct = (total > 0 && now < endAt) ? (elapsed / total) * 100 : (now >= endAt ? 100 : 0);

    // 用进度驱动解密比例
    revealPct = pct;

    progressEl.style.width = pct.toFixed(3) + '%';
    pctEl.textContent = pct.toFixed(2) + '%';

    // 状态文案
    if (now < START) {
      statusEl.textContent = '尚未开始';
    } else if (now < endAt) {
      statusEl.textContent = 'Loading';
    } else {
      statusEl.textContent = '已结束';
    }

    // 倒计时数字
    if (remain <= 0) {
      setNum('d', 0, 0); setNum('h', 0, 2); setNum('m', 0, 2); setNum('s', 0, 2);
      // 倒计时归零 → 先淡出倒计时，再揭晓视频
      if (!revealed) {
        revealed = true;
        timerEl.classList.add('gone');
        metaEl.classList.add('gone');
        // 淡出完成后彻底移除倒计时占位，再让视频进场
        setTimeout(function () {
          timerEl.style.display = 'none';
          metaEl.style.display = 'none';
          revealEl.classList.add('show');
        }, 950);
      }
      return;
    }

    const totalSec = Math.floor(remain / 1000);
    const days  = Math.floor(totalSec / 86400);
    const hours = Math.floor((totalSec % 86400) / 3600);
    const mins  = Math.floor((totalSec % 3600) / 60);
    const secs  = totalSec % 60;

    setNum('d', days, 0);   // 天数不补零
    setNum('h', hours, 2);
    setNum('m', mins, 2);
    setNum('s', secs, 2);
  }

  render();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
